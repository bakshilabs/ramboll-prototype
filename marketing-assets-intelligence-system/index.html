:root {
  --ink: #0c1b24; --ink-raised: #12242f; --ink-line: #1a303c;
  --bg: #0a1013; --letterbox: #070b0d;
  --paper: #fbfbf7; --stone: #f1f2ec;
  --teal: #0e9c8e; --teal-deep: #0b7f74; --teal-soft: #8fdcd2;
  --slate: #46606d; --mist: #8fa6b0; --mist-2: #b9c7cc;
  --sky: #59c7fc; --mint: #16ffc6; --amber: #f0b45a;
  --gradient-brand: linear-gradient(135deg, var(--sky), var(--mint));
  --panel: rgba(12, 21, 26, 0.8); --panel-line: rgba(143, 166, 176, 0.16);
  --font-display: "Inter", system-ui, -apple-system, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --tracking-cover: -0.032em; --tracking-title: -0.024em; --tracking-card: -0.014em; --tracking-eyebrow: 0.18em;
  --pad-top: 84px; --pad-x: 108px; --foot-bottom: 38px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1); --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
*, :before, :after { box-sizing: border-box; }
html, body { background: var(--letterbox); height: 100%; margin: 0; overflow: hidden; }
body { font-family: var(--font-body); color: var(--paper); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
p, h1, h2, h3, ol, dl, dd, blockquote, pre { margin: 0; }
ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
em { font-style: normal; }

.viewport { position: fixed; inset: 0; overflow: hidden; }
.viewport canvas { position: absolute; display: block; background: var(--bg); }
.stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; user-select: none; visibility: hidden; }
.is-ready .stage { visibility: visible; }
.no-gl .stage { background: radial-gradient(120% 90% at 70% 40%, #12242f, var(--bg) 70%); }

/* scrims keep type legible over the moving world */
.scrim { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.scrim--top { background: linear-gradient(180deg, rgba(10, 16, 19, 0.82) 0, rgba(10, 16, 19, 0.45) 260px, rgba(10, 16, 19, 0) 420px); transition: opacity 0.8s var(--ease); }
.scrim--edge { background: radial-gradient(130% 120% at 50% 45%, rgba(7, 11, 13, 0) 55%, rgba(7, 11, 13, 0.75) 100%); }
.stage[data-kind="cover"] .scrim--top { opacity: 0; }
.scrim--left { background: linear-gradient(90deg, rgba(10, 16, 19, 0.78), rgba(10, 16, 19, 0) 46%); opacity: 0; transition: opacity 0.9s var(--ease); }
.stage[data-kind="cover"] .scrim--left, .stage[data-kind="close"] .scrim--left { opacity: 1; }
.stage[data-kind="cover"] .scrim--left { background: linear-gradient(90deg, rgba(10, 16, 19, 0.92), rgba(10, 16, 19, 0.7) 34%, rgba(10, 16, 19, 0) 56%); }
.scrim--center { background: radial-gradient(60% 55% at 40% 50%, rgba(10, 16, 19, 0.7), rgba(10, 16, 19, 0) 100%); opacity: 0; transition: opacity 0.9s var(--ease); }
.stage[data-kind="statement"] .scrim--center { opacity: 1; }

/* ---------- slides ---------- */
.slide { position: absolute; inset: 0; z-index: 3; padding: var(--pad-top) var(--pad-x) 72px; visibility: hidden; opacity: 0; transition: opacity 0.6s var(--ease), visibility 0s linear 0.6s; pointer-events: none; }
.slide.is-current { visibility: visible; opacity: 1; transition: opacity 0.9s var(--ease) 0.15s, visibility 0s; }
.slide.is-current .panel, .slide.is-current button { pointer-events: auto; }

.eyebrow { font-family: var(--font-mono); font-size: 17px; font-weight: 500; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--teal-soft); }
.slide__head { position: relative; z-index: 3; max-width: 1180px; }
.slide__title { margin-top: 30px; font-family: var(--font-display); font-weight: 600; font-size: 54px; line-height: 1.1; letter-spacing: var(--tracking-title); color: var(--paper); }
.slide__support { margin-top: 14px; max-width: 980px; font-size: 26px; line-height: 1.4; font-weight: 600; color: var(--teal-soft); }
.slide.is-in .slide__head > * { animation: rise 0.9s var(--ease-out) both; }
.slide.is-in .slide__head > :nth-child(1) { animation-delay: 0.25s; }
.slide.is-in .slide__head > :nth-child(2) { animation-delay: 0.38s; }
.slide.is-in .slide__head > :nth-child(3) { animation-delay: 0.52s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

[data-from] { opacity: 0; transform: translateY(12px); transition: opacity 0.8s var(--ease) 0.2s, transform 0.9s var(--ease-out) 0.2s; }
[data-from].is-on { opacity: 1; transform: none; transition-delay: 0.6s; }
.slide:not(.is-in) [data-from] { transition: none; }

.mono, .mono-label, .mono-sub { font-family: var(--font-mono); font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
.mono-label { font-size: 14px; color: var(--teal-soft); }
.mono-sub { font-size: 13px; color: var(--mist); letter-spacing: 0.1em; }
.note, .src { font-size: 15px; color: var(--mist); line-height: 1.45; }
.chip-s { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; margin: 0 6px 6px 0; border-radius: 7px; background: rgba(143, 220, 210, 0.1); border: 1px solid rgba(143, 220, 210, 0.22); color: var(--teal-soft); font-family: var(--font-mono); font-size: 13px; font-weight: 500; letter-spacing: 0.04em; white-space: nowrap; }

/* ---------- panels ---------- */
.panel { position: absolute; z-index: 4; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 40px 90px -50px rgba(0, 0, 0, 0.9); overflow: hidden; }
.panel__head { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 16px 24px; border-bottom: 1px solid var(--panel-line); font-family: var(--font-mono); font-size: 13px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--teal-soft); }
.panel__head span:last-child { color: var(--mist); }
.live { display: inline-flex; align-items: center; gap: 9px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 0 rgba(22, 255, 198, 0.5); animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(22, 255, 198, 0.45); } 100% { box-shadow: 0 0 0 10px rgba(22, 255, 198, 0); } }

.attrs { display: flex; flex-direction: column; }
.attrs > div { display: grid; grid-template-columns: 118px 1fr; gap: 14px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--panel-line); }
.attrs > div:first-child { border-top: 0; }
.attrs dt { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mist); }
.attrs dd { font-size: 16px; line-height: 1.4; color: var(--paper); }
.attrs dd em { margin-left: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--teal-soft); }
.sw { display: flex; gap: 6px; }
.sw i { width: 30px; height: 18px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); }
.sw--big i { width: 52px; height: 30px; border-radius: 6px; }

/* ---------- cover ---------- */
.cover { position: absolute; inset: var(--pad-top) var(--pad-x) 72px; display: flex; flex-direction: column; z-index: 3; }
.cover__body { margin-top: auto; max-width: 1060px; }
.cover__title { font-family: var(--font-display); font-weight: 600; font-size: 104px; line-height: 1.02; letter-spacing: var(--tracking-cover); color: var(--paper); }
.cover__title em, .statement__b em, .close__title em { background: var(--gradient-brand); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; padding: 0.06em 0.04em; margin: 0 -0.04em; }
.cover__sub { margin-top: 30px; font-size: 30px; line-height: 1.4; color: var(--mist-2); max-width: 820px; }
.cover__foot { margin-top: 70px; }
.cover__rule { height: 1px; background: rgba(143, 166, 176, 0.22); margin-bottom: 24px; max-width: 1060px; }
.cover__meta { display: flex; justify-content: space-between; max-width: 1060px; font-size: 21px; color: var(--mist); }
.cover__meta .mono { font-size: 15px; }
.slide.is-in .cover > * { animation: rise 1.1s var(--ease-out) both; }
.slide.is-in .cover > :nth-child(1) { animation-delay: 0.5s; }
.slide.is-in .cover > :nth-child(2) { animation-delay: 0.7s; }
.slide.is-in .cover > :nth-child(3) { animation-delay: 1s; }

/* ---------- statement ---------- */
.statement { position: absolute; left: var(--pad-x); top: 50%; transform: translateY(-50%); max-width: 1500px; z-index: 3; }
.statement > [data-from] { transform: translateY(18px); }
.statement__a { font-size: 46px; font-weight: 600; letter-spacing: var(--tracking-title); color: var(--mist); }
.statement__verb { margin: 30px 0 22px; font-family: var(--font-mono); font-size: 18px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--teal-soft); display: flex; align-items: center; gap: 18px; }
.statement__verb::before { content: ""; width: 60px; height: 1px; background: var(--teal-soft); }
.statement__b { font-size: 100px; font-weight: 600; line-height: 1.02; letter-spacing: var(--tracking-cover); color: var(--paper); }
.slide.is-in .statement > .is-on:nth-child(1) { transition-delay: 0.5s; }
.slide.is-in .statement > .is-on:nth-child(2) { transition-delay: 1.3s; }
.slide.is-in .statement > .is-on:nth-child(3) { transition-delay: 1.8s; }

/* ---------- 01 ---------- */
.stats { position: absolute; left: var(--pad-x); bottom: 112px; display: flex; gap: 48px; align-items: flex-end; flex-wrap: wrap; max-width: 1300px; z-index: 3; }
.stat b { display: block; font-size: 52px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: var(--paper); }
.stat span { display: block; margin-top: 10px; font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mist); }
.stats .note { flex-basis: 100%; margin-top: 4px; }

/* ---------- 02 ---------- */
.counter { position: absolute; left: var(--pad-x); bottom: 112px; z-index: 3; }
.counter b { display: block; margin: 10px 0 8px; font-size: 76px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.analysis { right: var(--pad-x); top: 196px; width: 700px; }
.analysis__body { display: grid; grid-template-columns: 300px 1fr; gap: 24px; padding: 22px 24px 18px; }
.analysis__shot { position: relative; width: 300px; height: 400px; border-radius: 10px; overflow: hidden; }
.analysis__shot canvas { display: block; width: 300px; height: 400px; }
.bbox { position: absolute; border: 1.5px solid var(--teal-soft); border-radius: 3px; opacity: 0; transform: scale(1.06); transition: opacity 0.5s var(--ease), transform 0.6s var(--ease-out); }
.bbox span { position: absolute; left: -1.5px; top: -22px; height: 20px; padding: 0 6px; display: flex; align-items: center; border-radius: 3px 3px 3px 0; background: var(--teal-soft); color: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }
.bbox--wide { border-style: dashed; }
.bbox--wide span { top: auto; bottom: -22px; left: auto; right: -1.5px; border-radius: 3px 0 3px 3px; }
.analysis.is-on .bbox { opacity: 1; transform: none; }
.analysis.is-on .bbox:nth-of-type(1) { transition-delay: 1.4s; }
.analysis.is-on .bbox:nth-of-type(2) { transition-delay: 1.9s; }
.analysis.is-on .bbox:nth-of-type(3) { transition-delay: 2.4s; }
.analysis.is-on .bbox:nth-of-type(4) { transition-delay: 2.9s; }
.analysis .attrs > div { opacity: 0; transition: opacity 0.5s var(--ease); }
.analysis.is-on .attrs > div { opacity: 1; }
.analysis.is-on .attrs > div:nth-child(n) { transition-delay: calc(1.2s + var(--k, 0) * 1s); }
.analysis .attrs > div:nth-child(1) { --k: 0.3; } .analysis .attrs > div:nth-child(2) { --k: 0.6; }
.analysis .attrs > div:nth-child(3) { --k: 0.9; } .analysis .attrs > div:nth-child(4) { --k: 1.2; }
.analysis .attrs > div:nth-child(5) { --k: 1.5; } .analysis .attrs > div:nth-child(6) { --k: 1.8; }
.analysis .attrs > div:nth-child(7) { --k: 2.1; } .analysis .attrs > div:nth-child(8) { --k: 2.4; }
.analysis .attrs > div:nth-child(9) { --k: 2.7; } .analysis .attrs > div:nth-child(10) { --k: 3; }

/* ---------- 03 ---------- */
.taxonomy { left: var(--pad-x); bottom: 100px; width: 620px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 20px 24px 6px; font-family: var(--font-mono); font-size: 14px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
.crumbs span { padding: 6px 10px; border-radius: 7px; background: rgba(143, 220, 210, 0.1); color: var(--teal-soft); }
.crumbs i { font-style: normal; color: var(--mist); }
.tx-rows { padding: 8px 24px 16px; }
.tx-rows div { display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; border-top: 1px solid var(--panel-line); font-size: 17px; color: var(--mist-2); }
.tx-rows div:first-child { border-top: 0; }
.tx-rows b { font-size: 22px; font-weight: 600; color: var(--paper); font-variant-numeric: tabular-nums; }

/* ---------- 04 ---------- */
.chain { position: absolute; left: var(--pad-x); right: var(--pad-x); bottom: 100px; z-index: 3; }
.chain__cap { margin-bottom: 18px; font-size: 20px; color: var(--mist-2); }
.chain ol { display: flex; gap: 8px; }
.chain li { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 14px 14px 13px; border-radius: 10px; border: 1px solid var(--panel-line); background: rgba(12, 21, 26, 0.7); font-size: 17px; font-weight: 600; color: var(--mist); transition: background-color 0.5s var(--ease), border-color 0.5s var(--ease), color 0.5s var(--ease); position: relative; }
.chain li span { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.12em; color: var(--mist); }
.chain li:not(:last-child)::after { content: "→"; position: absolute; right: -8px; top: 50%; transform: translate(50%, -50%); color: var(--mist); font-size: 13px; z-index: 1; }
.chain.is-on li { border-color: rgba(22, 255, 198, 0.45); background: rgba(22, 255, 198, 0.08); color: var(--paper); transition-delay: calc(var(--d) + 1.2s); }
.chain.is-on li span { color: var(--mint); }

/* ---------- 05 beats ---------- */
.beats { position: absolute; left: var(--pad-x); top: 300px; width: 610px; z-index: 3; }
.beat { display: grid; grid-template-columns: 50px 1fr; gap: 16px; padding: 15px 0; border-top: 1px solid var(--panel-line); }
.beat:last-child { border-bottom: 1px solid var(--panel-line); }
.beat__num { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 9px; background: rgba(143, 166, 176, 0.12); font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--mist); transition: background-color 0.4s var(--ease), color 0.4s var(--ease); }
.beat__body { padding-top: 8px; }
.beat__label { font-family: var(--font-mono); font-size: 15px; font-weight: 500; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--mist); transition: color 0.4s var(--ease); }
.beat__text { display: none; margin-top: 14px; }
.beat.is-done .beat__num { background: rgba(143, 220, 210, 0.16); color: var(--teal-soft); }
.beat.is-done .beat__label { color: var(--mist-2); }
.beat.is-on .beat__num { background: var(--teal); color: var(--paper); }
.beat.is-on .beat__label { color: var(--teal-soft); }
.beat.is-on .beat__text { display: block; animation: rise 0.7s var(--ease-out) both 0.25s; }
.beat blockquote { font-size: 24px; line-height: 1.4; font-weight: 600; color: var(--paper); }
.beat .src { margin-top: 10px; font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.08em; }
pre { font-family: var(--font-mono); font-size: 16px; line-height: 1.65; color: var(--mist-2); background: rgba(7, 12, 15, 0.7); border: 1px solid var(--panel-line); border-radius: 10px; padding: 16px 18px; white-space: pre; }
pre b { font-weight: 500; color: var(--teal-soft); }
pre .ok { color: var(--mint); }

/* ---------- 06 ---------- */
.skillcard { left: var(--pad-x); top: 300px; width: 560px; }
.skillcard h3 { padding: 18px 24px 2px; font-size: 40px; font-weight: 600; letter-spacing: var(--tracking-card); }
.skillcard .attrs { padding: 6px 24px 14px; }
.attrs--tight dd { font-size: 16px; }
.orch { left: var(--pad-x); top: 300px; width: 660px; }
.orch table { width: 100%; border-collapse: collapse; }
.orch th { padding: 14px 24px 10px; text-align: left; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mist); }
.orch td { padding: 14px 24px 8px; border-top: 1px solid var(--panel-line); vertical-align: top; font-size: 17px; }
.orch td b { font-weight: 600; }
.orch td.num { font-family: var(--font-mono); font-size: 16px; color: var(--paper); text-align: right; }
.orch th:last-child { text-align: right; }
.orch .note { padding: 12px 24px 18px; border-top: 1px solid var(--panel-line); }

/* ---------- 07 ---------- */
.studio { left: var(--pad-x); top: 300px; width: 760px; }
.who { display: grid; grid-template-columns: 52px 1fr; gap: 6px 16px; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--panel-line); }
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--teal); font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
.who b { display: block; font-size: 19px; font-weight: 600; }
.who span:not(.avatar):not(.chip-s) { display: block; margin-top: 3px; font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.08em; color: var(--mist); }
.perm { grid-column: 2; margin-top: 6px; }
.select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 18px 24px; }
.sel { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--panel-line); background: rgba(7, 12, 15, 0.5); opacity: 0.25; transition: opacity 0.5s var(--ease), border-color 0.5s var(--ease); }
.sel span { display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mist); }
.sel b { display: block; margin-top: 6px; font-size: 17px; font-weight: 600; }
.select.is-on .sel { opacity: 1; border-color: rgba(143, 220, 210, 0.35); transition-delay: calc(var(--d) + 0.6s); }
.brief { padding: 4px 24px 20px; }
.brief p { margin: 8px 0 14px; font-size: 19px; line-height: 1.45; }
.brief .resolved { margin-bottom: 4px; }
.brief .src { margin: 0; }

/* ---------- 08 ---------- */
.genlog { right: var(--pad-x); top: 300px; width: 600px; }
.genlog ol { padding: 8px 24px 16px; }
.genlog li { display: grid; grid-template-columns: 52px 130px 1fr; gap: 12px; align-items: baseline; padding: 11px 0; border-top: 1px solid var(--panel-line); opacity: 0; transform: translateX(8px); transition: opacity 0.5s var(--ease), transform 0.6s var(--ease-out); }
.genlog li:first-child { border-top: 0; }
.genlog.is-on li { opacity: 1; transform: none; transition-delay: calc(var(--d) + 0.6s); }
.genlog .t { font-family: var(--font-mono); font-size: 13px; color: var(--mist); }
.genlog .s { font-family: var(--font-mono); font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal-soft); }
.genlog p { font-size: 16px; line-height: 1.4; color: var(--mist-2); }

/* ---------- 09 ---------- */
.checks { left: var(--pad-x); top: 290px; width: 660px; }
.checks ol { padding: 6px 24px 8px; }
.checks li { display: grid; grid-template-columns: 30px 1fr; gap: 14px; padding: 9px 0; border-top: 1px solid var(--panel-line); }
.checks li:first-child { border-top: 0; }
.checks b { font-size: 16px; font-weight: 600; }
.checks p { margin-top: 2px; font-size: 14.5px; line-height: 1.4; color: var(--mist); }
.tick { width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; border: 1.5px solid rgba(143, 166, 176, 0.35); position: relative; transition: background-color 0.3s var(--ease), border-color 0.3s var(--ease); }
.tick::after { content: ""; position: absolute; left: 6px; top: 3px; width: 6px; height: 10px; border: solid var(--ink); border-width: 0 2px 2px 0; transform: rotate(45deg); opacity: 0; transition: opacity 0.3s; }
.checks.is-on .tick { background: var(--teal-soft); border-color: var(--teal-soft); transition-delay: var(--d); }
.checks.is-on .tick::after { opacity: 1; transition-delay: var(--d); }
.checks li .now { display: none; }
.checks li.is-fix .was { color: var(--amber); }
.checks.is-on li.is-fix .tick { animation: fixtick 0.01s linear both; animation-delay: calc(var(--d) + 1.2s); background: var(--amber); border-color: var(--amber); }
@keyframes fixtick { to { background: var(--teal-soft); border-color: var(--teal-soft); } }
.checks.is-on li.is-fix .was { animation: hide 0.01s both; animation-delay: calc(var(--d) + 1.6s); }
.checks.is-on li.is-fix .now { display: inline; opacity: 0; animation: show 0.4s both; animation-delay: calc(var(--d) + 1.6s); color: var(--teal-soft); }
@keyframes hide { to { display: none; opacity: 0; font-size: 0; } }
@keyframes show { from { opacity: 0; } to { opacity: 1; } }
.checks__sum { display: flex; gap: 28px; padding: 14px 24px 16px; border-top: 1px solid var(--panel-line); font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mist); opacity: 0; transition: opacity 0.6s; }
.checks__sum b { margin-right: 6px; font-family: var(--font-body); font-size: 22px; letter-spacing: -0.02em; color: var(--paper); }
.checks.is-on .checks__sum { opacity: 1; transition-delay: 6.6s; }

/* ---------- 10 ---------- */
.prov { right: var(--pad-x); top: 290px; width: 600px; }
.prov .attrs { padding: 8px 24px 14px; }
.loopring { position: absolute; right: 270px; top: 690px; width: 280px; height: 280px; z-index: 3; }
.loopring svg { width: 100%; height: 100%; overflow: visible; }
.lr-track { fill: none; stroke: rgba(143, 166, 176, 0.22); stroke-width: 1.5; }
.lr-run { fill: none; stroke: var(--mint); stroke-width: 2; stroke-dasharray: 60 744; transform-origin: 180px 180px; animation: spin 6s linear infinite; }
@keyframes spin { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }
.lr-dot { fill: var(--bg); stroke: var(--teal-soft); stroke-width: 2; }
.lr-text { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.14em; fill: var(--mist-2); }

/* ---------- 11 ---------- */
.kpis { position: absolute; left: var(--pad-x); bottom: 112px; display: flex; gap: 18px; z-index: 3; }
.kpi { width: 250px; padding: 20px 22px; border-radius: 14px; border: 1px solid var(--panel-line); background: rgba(12, 21, 26, 0.72); backdrop-filter: blur(10px); }
.kpi b { display: block; font-size: 46px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; background: var(--gradient-brand); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.kpi span { display: block; margin-top: 10px; font-size: 16px; line-height: 1.35; color: var(--mist-2); }

/* ---------- close ---------- */
.close { position: absolute; left: var(--pad-x); top: var(--pad-top); bottom: 100px; width: 900px; display: flex; flex-direction: column; z-index: 3; }
.close__title { margin-top: 30px; font-size: 76px; font-weight: 600; line-height: 1.04; letter-spacing: var(--tracking-cover); }
.claims { margin-top: auto; }
.claims li { display: grid; grid-template-columns: 54px 1fr; align-items: baseline; padding: 13px 0; border-top: 1px solid var(--panel-line); font-size: 24px; font-weight: 500; color: var(--paper); }
.claims li:last-child { border-bottom: 1px solid var(--panel-line); }
.claims span { font-family: var(--font-mono); font-size: 15px; color: var(--teal-soft); }
.slide.is-in .close > * , .slide.is-in .claims li { animation: rise 0.9s var(--ease-out) both; }
.slide.is-in .close > :nth-child(1) { animation-delay: 0.3s; }
.slide.is-in .close > :nth-child(2) { animation-delay: 0.45s; }
.slide.is-in .claims li { animation-delay: var(--d); }

/* ---------- 3D labels ---------- */
.labels { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.lbl { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity 0.6s var(--ease); will-change: transform; }
.lbl.is-on { opacity: 1; }
.lbl i { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--teal-soft)); box-shadow: 0 0 0 3px rgba(10, 16, 19, 0.7); }
.lbl::before { content: ""; position: absolute; left: 0; bottom: 0; width: 1px; height: 26px; background: rgba(244, 239, 230, 0.4); }
.lbl__t, .lbl__s { position: absolute; left: 10px; white-space: nowrap; }
.lbl__t { bottom: 34px; font-family: var(--font-mono); font-size: 14px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--paper); text-shadow: 0 1px 10px rgba(7, 11, 13, 0.9); }
.lbl__s { bottom: 16px; font-size: 14px; color: var(--mist); text-shadow: 0 1px 10px rgba(7, 11, 13, 0.9); }
.lbl.is-quiet .lbl__t { font-size: 12px; color: var(--mist-2); }
.lbl.is-quiet::before { height: 16px; }
.lbl.is-quiet .lbl__t { bottom: 18px; }
.lbl.is-path i { background: var(--mint); }
.lbl.is-path .lbl__t { color: var(--paper); }
.lbl.is-path .lbl__s { color: var(--mint); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }

/* ---------- chrome ---------- */
.chrome { position: absolute; right: var(--pad-x); bottom: var(--foot-bottom); z-index: 20; display: flex; align-items: center; gap: 22px; font-family: var(--font-mono); font-size: 15px; font-weight: 500; letter-spacing: 0.14em; color: var(--mist); }
.chrome__bar { display: flex; gap: 6px; }
.chrome { transition: opacity 0.6s var(--ease); }
.stage[data-kind="cover"] .chrome { opacity: 0; pointer-events: none; }
.chrome__bar i { width: 24px; height: 3px; border-radius: 2px; background: rgba(143, 166, 176, 0.25); transition: background-color 0.5s var(--ease); }
.chrome__bar i.is-done { background: var(--teal-soft); }
.play { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid rgba(143, 166, 176, 0.3); border-radius: 8px; background: transparent; cursor: pointer; font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mist); }
.play svg { width: 12px; height: 12px; fill: currentColor; }
.play .i-pause, .is-playing .play .i-play { display: none; }
.is-playing .play .i-pause { display: inline; }
.play:hover, .menu-btn:hover { color: var(--paper); border-color: rgba(143, 220, 210, 0.6); }
.menu-btn { position: absolute; top: 28px; right: 32px; z-index: 30; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(143, 166, 176, 0.3); background: rgba(12, 21, 26, 0.6); cursor: pointer; font-family: var(--font-mono); font-size: 13px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mist-2); }
.menu-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.6; fill: none; }
.menu { position: absolute; top: 80px; right: 32px; z-index: 30; width: 520px; max-height: 900px; overflow: auto; padding: 18px 10px 12px; border-radius: 16px; border: 1px solid var(--panel-line); background: rgba(10, 17, 21, 0.94); backdrop-filter: blur(14px); }
.menu__head { padding: 0 14px 12px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--teal-soft); }
.menu button { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; align-items: baseline; padding: 10px 14px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; text-align: left; font-size: 18px; font-weight: 500; color: var(--paper); }
.menu button:hover { background: rgba(143, 220, 210, 0.08); }
.menu button span, .menu button em { font-family: var(--font-mono); font-size: 13px; color: var(--mist); }
.menu-open .slide { pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  *, :before, :after { animation-duration: 0.01ms !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
}

.lbl.is-left::before { left: 0; }
.lbl.is-left .lbl__t, .lbl.is-left .lbl__s { left: auto; right: 10px; text-align: right; }

/* studio panel: the selection grid is always present, values arrive in sequence; the brief appears last */
.studio .select[data-from] { opacity: 1; transform: none; }
.studio .sel b { opacity: 0; transition: opacity 0.5s var(--ease); }
.studio .select.is-on .sel b { opacity: 1; transition-delay: calc(var(--d) + 0.6s); }
.studio .brief:not(.is-on) { display: none; }
.studio .brief.is-on { animation: rise 0.8s var(--ease-out) both 0.4s; }
.studio .brief-empty { margin: 0 24px 22px; padding: 16px 18px; border-radius: 10px; border: 1px dashed var(--panel-line); font-size: 17px; color: var(--mist); }
.slide[data-step="2"] .studio .brief-empty { display: none; }
